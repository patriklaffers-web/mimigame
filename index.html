<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bone Blaster</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  canvas { display: block; cursor: crosshair; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W, H, SW, SH, zoom = 1; // W/H = world size, SW/SH = screen size
  // Zoom in on small (phone) screens so everything is drawn bigger
  function setZoom() {
    zoom = Math.min(1.6, Math.max(1, 560 / Math.min(SW, SH)));
    W = SW / zoom; H = SH / zoom;
  }
  let dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    SW = innerWidth; SH = innerHeight;
    canvas.width = SW * dpr; canvas.height = SH * dpr;
    canvas.style.width = SW + 'px'; canvas.style.height = SH + 'px';
    setZoom();
  }
  addEventListener('resize', resize); resize();

  // ---------- Input ----------
  const keys = {};
  const mouse = { x: W / 2, y: H / 2, down: false };
  addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (e.key.toLowerCase() === 'r') reload(); });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  canvas.addEventListener('mousedown', () => { mouse.down = true; started = true; });
  addEventListener('mouseup', () => { mouse.down = false; });

  // ---------- Touch: twin-stick (left = move, right = aim & fire) ----------
  const STICK_R = 55;
  const sticks = { move: null, aim: null }; // each: { id, ox, oy, x, y }
  let isTouch = 'ontouchstart' in window;
  function reloadBtn() { return { x: SW - 48, y: 48, r: 34 }; }
  function stickVec(st) {
    if (!st) return { x: 0, y: 0, mag: 0 };
    const dx = st.x - st.ox, dy = st.y - st.oy, d = Math.hypot(dx, dy);
    const m = Math.min(d, STICK_R) / STICK_R;
    return d ? { x: dx / d * m, y: dy / d * m, mag: m } : { x: 0, y: 0, mag: 0 };
  }
  canvas.addEventListener('touchstart', e => {
    e.preventDefault(); isTouch = true;
    if (!started) { started = true; return; }
    for (const t of e.changedTouches) {
      const x = t.clientX, y = t.clientY, rb = reloadBtn();
      if (Math.hypot(x - rb.x, y - rb.y) < rb.r + 10) { reload(); continue; }
      const st = { id: t.identifier, ox: x, oy: y, x, y };
      if (x < SW / 2) { if (!sticks.move) sticks.move = st; }
      else if (!sticks.aim) sticks.aim = st;
    }
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches)
      for (const k of ['move', 'aim']) {
        const st = sticks[k];
        if (st && st.id === t.identifier) {
          st.x = t.clientX; st.y = t.clientY;
          // drag the base along so the stick never feels "stuck" at the edge
          const dx = st.x - st.ox, dy = st.y - st.oy, d = Math.hypot(dx, dy);
          if (d > STICK_R * 1.5) { st.ox = st.x - dx / d * STICK_R * 1.5; st.oy = st.y - dy / d * STICK_R * 1.5; }
        }
      }
  }, { passive: false });
  function endTouch(e) {
    e.preventDefault();
    for (const t of e.changedTouches)
      for (const k of ['move', 'aim']) if (sticks[k] && sticks[k].id === t.identifier) sticks[k] = null;
  }
  canvas.addEventListener('touchend', endTouch, { passive: false });
  canvas.addEventListener('touchcancel', endTouch, { passive: false });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  // ---------- State ----------
  const MAG_SIZE = 12, RELOAD_TIME = 1.1, FIRE_DELAY = 0.16, RESPAWN_TIME = 2, INVULN_TIME = 2;
  const player = { x: W / 2, y: H / 2, r: 14, speed: 230, hp: 100, maxHp: 100, angle: 0,
                   alive: true, respawnTimer: 0, invuln: 0, ammo: MAG_SIZE, reloading: 0, fireCd: 0, recoil: 0 };
  let skeletons = [], bullets = [], particles = [], bones = [];
  let toSpawn = 0, spawnCd = 0;
  let kills = 0, deaths = 0, wave = 0, waveTimer = 0, started = false, shake = 0;

  function reload() {
    if (player.alive && player.reloading <= 0 && player.ammo < MAG_SIZE) player.reloading = RELOAD_TIME;
  }

  function spawnSkeleton() {
    // spawn just outside a random screen edge
    const side = Math.floor(Math.random() * 4), m = 30;
    let x, y;
    if (side === 0) { x = Math.random() * W; y = -m; }
    else if (side === 1) { x = W + m; y = Math.random() * H; }
    else if (side === 2) { x = Math.random() * W; y = H + m; }
    else { x = -m; y = Math.random() * H; }
    const tough = Math.random() < Math.min(0.1 + wave * 0.04, 0.4);
    skeletons.push({ x, y, r: tough ? 17 : 14, hp: tough ? 4 : 2, maxHp: tough ? 4 : 2, tough,
                     speed: (tough ? 60 : 85) + Math.random() * 25 + wave * 4,
                     walk: Math.random() * 10, hit: 0, attackCd: 0 });
  }

  function startWave() {
    wave++;
    // fewer skeletons on small (phone) screens so it stays fair
    const n = Math.max(3, Math.round((4 + wave * 2) * Math.min(1, Math.max(0.5, W * H / (1000 * 650)))));
    toSpawn = n; spawnCd = 0; waveTimer = 0;
  }

  function respawn() {
    // respawn in the spot farthest from skeletons (out of a few candidates)
    let best = { x: W / 2, y: H / 2 }, bestD = -1;
    for (let i = 0; i < 12; i++) {
      const c = { x: 60 + Math.random() * (W - 120), y: 60 + Math.random() * (H - 120) };
      const d = skeletons.reduce((m, s) => Math.min(m, Math.hypot(s.x - c.x, s.y - c.y)), Infinity);
      if (d > bestD) { bestD = d; best = c; }
    }
    Object.assign(player, best, { hp: player.maxHp, alive: true, invuln: INVULN_TIME, ammo: MAG_SIZE, reloading: 0 });
  }

  function burst(x, y, color, n, speed = 200) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = Math.random() * speed;
      particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.4 + Math.random() * 0.4, color, size: 2 + Math.random() * 3 });
    }
  }

  // ---------- Update ----------
  function update(dt) {
    if (!started) return;
    if (wave === 0) startWave();

    // Player
    if (player.alive) {
      let dx = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0);
      let dy = (keys['s'] || keys['arrowdown'] ? 1 : 0) - (keys['w'] || keys['arrowup'] ? 1 : 0);
      let len = Math.hypot(dx, dy) || 1;
      if (sticks.move) { const v = stickVec(sticks.move); dx = v.x; dy = v.y; len = 1; }
      player.x = Math.max(player.r, Math.min(W - player.r, player.x + dx / len * player.speed * dt));
      player.y = Math.max(player.r, Math.min(H - player.r, player.y + dy / len * player.speed * dt));
      const aimV = stickVec(sticks.aim);
      let firing = mouse.down;
      if (isTouch) {
        firing = aimV.mag > 0.25;
        if (aimV.mag > 0.1) player.angle = Math.atan2(aimV.y, aimV.x);
        else if (sticks.move && stickVec(sticks.move).mag > 0.1) player.angle = Math.atan2(dy, dx);
      } else player.angle = Math.atan2(mouse.y / zoom - player.y, mouse.x / zoom - player.x);
      player.invuln = Math.max(0, player.invuln - dt);
      player.fireCd -= dt;
      player.recoil = Math.max(0, player.recoil - dt * 30);

      if (player.reloading > 0) {
        player.reloading -= dt;
        if (player.reloading <= 0) player.ammo = MAG_SIZE;
      } else if (firing && player.fireCd <= 0) {
        if (player.ammo > 0) {
          player.ammo--; player.fireCd = FIRE_DELAY; player.recoil = 5; shake = Math.max(shake, 3);
          const spread = (Math.random() - 0.5) * 0.06, a = player.angle + spread;
          const gx = player.x + Math.cos(player.angle) * 26, gy = player.y + Math.sin(player.angle) * 26;
          bullets.push({ x: gx, y: gy, vx: Math.cos(a) * 900, vy: Math.sin(a) * 900, life: 1 });
          burst(gx, gy, '#ffd36b', 5, 120);
          if (player.ammo === 0) reload();
        } else reload();
      }
    } else {
      player.respawnTimer -= dt;
      if (player.respawnTimer <= 0) respawn();
    }

    // Bullets
    for (const b of bullets) {
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      for (const s of skeletons) {
        if (s.hp > 0 && Math.hypot(s.x - b.x, s.y - b.y) < s.r + 3) {
          s.hp--; s.hit = 0.1; b.life = 0;
          s.x += b.vx * 0.012; s.y += b.vy * 0.012; // knockback
          burst(b.x, b.y, '#e8e2cf', 6, 160);
          if (s.hp <= 0) {
            kills++; shake = Math.max(shake, 6);
            burst(s.x, s.y, '#e8e2cf', 22, 260);
            for (let i = 0; i < 4; i++) bones.push({ x: s.x, y: s.y, a: Math.random() * 6.28,
              vx: (Math.random() - 0.5) * 300, vy: (Math.random() - 0.5) * 300, spin: (Math.random() - 0.5) * 20, life: 6 });
          }
          break;
        }
      }
    }
    bullets = bullets.filter(b => b.life > 0 && b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20);
    skeletons = skeletons.filter(s => s.hp > 0);

    // Skeletons
    for (const s of skeletons) {
      s.hit = Math.max(0, s.hit - dt);
      s.attackCd = Math.max(0, s.attackCd - dt);
      let tx, ty;
      if (player.alive) { tx = player.x; ty = player.y; }
      else { tx = s.x + Math.sin(s.walk * 0.3) * 50; ty = s.y + Math.cos(s.walk * 0.27) * 50; } // wander while you're dead
      const d = Math.hypot(tx - s.x, ty - s.y) || 1;
      const sp = player.alive ? s.speed : s.speed * 0.3;
      if (d > s.r + player.r - 4) { s.x += (tx - s.x) / d * sp * dt; s.y += (ty - s.y) / d * sp * dt; s.walk += dt * 10; }
      // separate from other skeletons
      for (const o of skeletons) {
        if (o === s) continue;
        const ox = s.x - o.x, oy = s.y - o.y, od = Math.hypot(ox, oy);
        if (od > 0 && od < s.r + o.r) { const p = (s.r + o.r - od) / 2; s.x += ox / od * p; s.y += oy / od * p; }
      }
      // attack
      if (player.alive && player.invuln <= 0 && s.attackCd <= 0 && Math.hypot(player.x - s.x, player.y - s.y) < s.r + player.r + 4) {
        player.hp -= s.tough ? 25 : 15; s.attackCd = 0.8; shake = Math.max(shake, 8);
        burst(player.x, player.y, '#c0392b', 10, 180);
        if (player.hp <= 0) {
          player.alive = false; player.respawnTimer = RESPAWN_TIME; deaths++;
          burst(player.x, player.y, '#c0392b', 40, 300);
        }
      }
    }

    // Trickle in this wave's skeletons
    if (toSpawn > 0 && (spawnCd -= dt) <= 0) { spawnSkeleton(); toSpawn--; spawnCd = 0.35; }

    // Next wave once all are cleared
    if (skeletons.length === 0 && toSpawn === 0) {
      waveTimer += dt;
      if (waveTimer > 2) startWave();
    }

    // Effects
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.9; p.vy *= 0.9; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);
    for (const b of bones) { b.x += b.vx * dt; b.y += b.vy * dt; b.vx *= 0.9; b.vy *= 0.9; b.a += b.spin * dt; b.spin *= 0.9; b.life -= dt; }
    bones = bones.filter(b => b.life > 0);
    shake = Math.max(0, shake - dt * 30);
  }

  // ---------- Draw ----------
  function drawSkeleton(s) {
    const sc = s.r / 14;
    const bob = Math.sin(s.walk) * 2;
    const face = Math.atan2(player.y - s.y, player.x - s.x);
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.scale(sc, sc);
    ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 4;
    const bone = s.hit > 0 ? '#fff' : (s.tough ? '#c9b98f' : '#e8e2cf');
    ctx.strokeStyle = bone; ctx.fillStyle = bone; ctx.lineCap = 'round';
    // legs
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-4, 8); ctx.lineTo(-6 + Math.sin(s.walk) * 4, 20);
    ctx.moveTo(4, 8); ctx.lineTo(6 - Math.sin(s.walk) * 4, 20);
    ctx.stroke();
    // spine + ribs
    ctx.beginPath(); ctx.moveTo(0, -6 + bob); ctx.lineTo(0, 9); ctx.stroke();
    ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const y = -3 + i * 4 + bob;
      ctx.beginPath(); ctx.moveTo(-7 + i, y); ctx.quadraticCurveTo(0, y - 3, 7 - i, y); ctx.stroke();
    }
    // arms reaching toward player
    ctx.lineWidth = 2.5;
    const ax = Math.cos(face) * 14, ay = Math.sin(face) * 14;
    ctx.beginPath();
    ctx.moveTo(-7, -4 + bob); ctx.lineTo(-7 + ax, -4 + ay + bob + Math.sin(s.walk) * 2);
    ctx.moveTo(7, -4 + bob); ctx.lineTo(7 + ax, -4 + ay + bob - Math.sin(s.walk) * 2);
    ctx.stroke();
    // skull
    ctx.beginPath(); ctx.arc(0, -14 + bob, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(-4, -9 + bob, 8, 5);
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(-3, -15 + bob, 2.2, 0, Math.PI * 2); ctx.arc(3, -15 + bob, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = s.tough ? '#ff4040' : '#ff8a3d';
    ctx.beginPath(); ctx.arc(-3, -15 + bob, 0.9, 0, Math.PI * 2); ctx.arc(3, -15 + bob, 0.9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    for (let i = -3; i <= 3; i += 2) ctx.fillRect(i - 0.5, -8 + bob, 1, 3);
    ctx.restore();
    // hp bar for damaged skeletons
    if (s.hp < s.maxHp) {
      ctx.fillStyle = '#400'; ctx.fillRect(s.x - 14, s.y - s.r - 22, 28, 4);
      ctx.fillStyle = '#e74c3c'; ctx.fillRect(s.x - 14, s.y - s.r - 22, 28 * s.hp / s.maxHp, 4);
    }
  }

  function drawPlayer() {
    if (!player.alive) return;
    if (player.invuln > 0 && Math.floor(player.invuln * 10) % 2 === 0) return; // blink while invulnerable
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);
    // pistol
    ctx.fillStyle = '#333';
    ctx.fillRect(10 - player.recoil, -3, 18, 6);
    ctx.fillStyle = '#555';
    ctx.fillRect(10 - player.recoil, 1, 6, 7);
    // hands
    ctx.fillStyle = '#e0ac69';
    ctx.beginPath(); ctx.arc(11 - player.recoil, 2, 4, 0, Math.PI * 2); ctx.fill();
    // body
    ctx.fillStyle = '#2e86de';
    ctx.beginPath(); ctx.arc(0, 0, player.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1b4f8a'; ctx.lineWidth = 3; ctx.stroke();
    // head
    ctx.fillStyle = '#e0ac69';
    ctx.beginPath(); ctx.arc(2, 0, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5a3a1a';
    ctx.beginPath(); ctx.arc(0, 0, 7, Math.PI * 0.5, Math.PI * 1.5); ctx.fill();
    ctx.restore();
  }

  function drawHUD() {
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(12, 12, 230, 84);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(`Wave ${wave}   Kills ${kills}   Deaths ${deaths}`, 22, 34);
    // hp
    ctx.fillStyle = '#400'; ctx.fillRect(22, 46, 200, 12);
    ctx.fillStyle = '#2ecc71'; ctx.fillRect(22, 46, 200 * Math.max(0, player.hp) / player.maxHp, 12);
    // ammo
    ctx.fillStyle = '#ffd36b';
    if (player.reloading > 0) {
      ctx.fillText('Reloading...', 22, 84);
      ctx.fillRect(130, 74, 92 * (1 - player.reloading / RELOAD_TIME), 8);
    } else {
      for (let i = 0; i < MAG_SIZE; i++) {
        ctx.globalAlpha = i < player.ammo ? 1 : 0.2;
        ctx.fillRect(22 + i * 16, 70, 8, 16);
      }
      ctx.globalAlpha = 1;
    }
  }

  function centerText(big, small) {
    ctx.textAlign = 'center';
    const k = Math.min(1, SW / 520);
    ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.round(48 * k)}px system-ui, sans-serif`;
    ctx.fillText(big, SW / 2, SH / 2 - 10);
    ctx.font = `${Math.max(14, Math.round(18 * k))}px system-ui, sans-serif`; ctx.fillStyle = '#ccc';
    small.split('\n').forEach((line, i) => ctx.fillText(line, SW / 2, SH / 2 + 26 + i * 24));
  }

  function drawStick(st, label, color) {
    const v = stickVec(st);
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(st.ox, st.oy, STICK_R, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 0.6; ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(st.ox + v.x * STICK_R, st.oy + v.y * STICK_R, 24, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawTouchControls() {
    if (!isTouch || !started) return;
    // hints where no finger is down
    ctx.font = '15px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,0.3)';
    if (sticks.move) drawStick(sticks.move, 'MOVE', '#2e86de');
    else ctx.fillText('drag here to MOVE', SW * 0.25, SH - 30);
    if (sticks.aim) drawStick(sticks.aim, 'AIM', '#e74c3c');
    else ctx.fillStyle = 'rgba(255,255,255,0.3)', ctx.fillText('drag here to AIM & SHOOT', SW * 0.75, SH - 30);
    // reload button
    const rb = reloadBtn();
    ctx.globalAlpha = player.reloading > 0 ? 0.3 : 0.6;
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(rb.x, rb.y, rb.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ffd36b'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#ffd36b'; ctx.font = 'bold 22px system-ui, sans-serif'; ctx.textBaseline = 'middle';
    ctx.fillText('R', rb.x, rb.y + 1); ctx.textBaseline = 'alphabetic';
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    ctx.scale(zoom, zoom);
    // ground
    ctx.fillStyle = '#34332e'; ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.strokeStyle = '#403e37'; ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 48) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += 48) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    // scattered bones
    for (const b of bones) {
      ctx.save(); ctx.globalAlpha = Math.min(1, b.life); ctx.translate(b.x, b.y); ctx.rotate(b.a);
      ctx.strokeStyle = '#d8d2bf'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(6, 0); ctx.stroke();
      ctx.restore();
    }

    for (const s of skeletons) drawSkeleton(s);
    drawPlayer();

    ctx.fillStyle = '#fff3c4'; ctx.shadowColor = '#ffb300'; ctx.shadowBlur = 8;
    for (const b of bullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill(); }
    ctx.shadowBlur = 0;
    for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life * 2); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); }
    ctx.globalAlpha = 1;
    ctx.restore();

    drawHUD();
    drawTouchControls();

    if (!started) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, SW, SH);
      centerText('BONE BLASTER', isTouch
        ? 'Left thumb: move · Right thumb: aim & shoot\nR button: reload\nTap to start'
        : 'WASD / arrows to move · mouse to aim · click to shoot · R to reload\nClick to start');
    } else if (!player.alive) {
      ctx.fillStyle = 'rgba(80,0,0,0.35)'; ctx.fillRect(0, 0, SW, SH);
      centerText('YOU DIED', `Respawning in ${Math.max(0, player.respawnTimer).toFixed(1)}s...`);
    } else if (skeletons.length === 0 && toSpawn === 0 && wave > 0) {
      centerText(`Wave ${wave} cleared!`, 'Get ready...');
    }
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
