<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<!-- ARTIFACT-START -->
<title>Hlavné mestá Európy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: atlas worksheet — header with mode switch and progress, then regions; each row shows the given name and a blank to fill */
:root {
  --bg: #eef2f5;
  --sheet: #ffffff;
  --ink: #132a3e;
  --muted: #5b6f80;
  --line: #d3dde5;
  --accent: #1f6fb2;
  --ok: #1d7a4f;
  --ok-bg: #e3f3ea;
  --bad: #b3362d;
  --bad-bg: #fbe8e6;
  --slot: #f4f7f9;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1822; --sheet: #14222f; --ink: #e4edf4; --muted: #93a6b6; --line: #253747;
  --accent: #5aa8e6; --ok: #5fcf97; --ok-bg: #143327; --bad: #f08a80; --bad-bg: #3a1c1a; --slot: #1a2b3a;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d1822; --sheet: #14222f; --ink: #e4edf4; --muted: #93a6b6; --line: #253747;
  --accent: #5aa8e6; --ok: #5fcf97; --ok-bg: #143327; --bad: #f08a80; --bad-bg: #3a1c1a; --slot: #1a2b3a;
  color-scheme: dark }

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 18px; }

header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(28px, 5vw, 44px); line-height: 1; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
.sub { margin: 6px 0 0; color: var(--muted); max-width: 60ch; }

.modes { display: inline-flex; background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 4px; gap: 4px; flex-wrap: wrap; }
.modes button {
  font: 600 15px var(--f-body); border: 0; border-radius: 7px; padding: 9px 14px; cursor: pointer;
  background: transparent; color: var(--muted);
}
.modes button[aria-selected="true"] { background: var(--accent); color: var(--sheet); }
.modes button small { font-family: var(--f-mono); font-weight: 500; font-size: 12px; margin-left: 6px; opacity: .8; }

.panel {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  display: grid; gap: 10px; box-shadow: 0 6px 20px -14px rgba(19,42,62,.45);
}
.panel-top { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.stats { display: flex; gap: 20px; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.stat { display: grid; gap: 2px; }
.stat b { font-size: 22px; font-weight: 500; line-height: 1; }
.stat span { font-family: var(--f-body); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns button {
  font: 600 14px var(--f-body); border-radius: 8px; padding: 8px 12px; cursor: pointer;
  border: 1.5px solid var(--line); background: transparent; color: var(--ink);
}
.btns button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .3s ease; }
.msg { min-height: 1.45em; margin: 0; font-weight: 500; font-size: 14px; }
.msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); } .msg.info { color: var(--muted); }

.done { background: var(--ok-bg); color: var(--ok); border-radius: 12px; padding: 16px; font-weight: 600; font-size: 17px; }

.regions { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; align-items: start; }
.region { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 10px; min-width: 0; }
.region h2 { font-family: var(--f-display); font-weight: 700; font-size: 18px; margin: 0 0 4px; display: flex; justify-content: space-between; align-items: baseline; }
.region h2 small { font-family: var(--f-mono); font-size: 12px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 8px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.region ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.region li {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 4px 4px 4px 8px; border-radius: 6px;
  background: var(--slot); font-size: 14px; align-items: center; min-height: 40px;
}
.region li .given { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.region li .ans { min-width: 0; overflow-wrap: anywhere; }
.region li input {
  font: 500 15px var(--f-body); color: var(--ink); background: var(--sheet);
  border: 1.5px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; min-width: 0;
}
.region li input:focus { outline: none; border-color: var(--accent); }
.region li.wrong input { border-color: var(--bad); background: var(--bad-bg); animation: shake .3s; }
.region li.found { background: var(--ok-bg); }
.region li.found .ans { color: var(--ok); font-weight: 600; padding-left: 10px; }
.region li.missed { background: var(--bad-bg); }
.region li.missed .ans { color: var(--bad); font-weight: 600; padding-left: 10px; }
.region li.flash { animation: flash .9s ease; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--ok); } 100% { box-shadow: none; } }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

@media (max-width: 560px) {
  .regions { grid-template-columns: 1fr; }
  .modes { width: 100%; }
  .modes button { flex: 1; }
}
@media (prefers-reduced-motion: reduce) { .region li.flash, .region li.wrong input { animation: none; } .bar i { transition: none; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Hlavné mestá Európy</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="modes" role="tablist" aria-label="Mód hry">
      <button role="tab" id="tab-mesta" data-mode="mesta">Mesto → štát<small id="tc-mesta"></small></button>
      <button role="tab" id="tab-staty" data-mode="staty">Štát → mesto<small id="tc-staty"></small></button>
    </div>
  </header>

  <div class="panel">
    <div class="panel-top">
      <div class="stats">
        <div class="stat"><b id="score">0/46</b><span>uhádnuté</span></div>
        <div class="stat"><b id="time">0:00</b><span>čas</span></div>
        <div class="stat"><b id="errors">0</b><span>chyby</span></div>
      </div>
      <div class="btns">
        <button type="button" id="giveup">Vzdať sa</button>
        <button type="button" id="restart">Hrať znova</button>
      </div>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <p class="msg info" id="msg" aria-live="polite"></p>
  </div>

  <div class="done" id="done" hidden></div>
  <div class="regions" id="regions"></div>
</div>

<script>
// [štát, hlavné mesto, región, alternatívne názvy štátu, alternatívne názvy mesta]
const DATA = [
  ["Spojené kráľovstvo","Londýn","Západná Európa",["Veľká Británia","Británia","Anglicko","UK","Spojene kralovstvo Velkej Britanie"],["London"]],
  ["Írsko","Dublin","Západná Európa",["Irska republika"],[]],
  ["Francúzsko","Paríž","Západná Európa",[],["Paris"]],
  ["Belgicko","Brusel","Západná Európa",[],["Brussel","Bruxelles"]],
  ["Holandsko","Amsterdam","Západná Európa",["Nizozemsko","Nizozemsko kralovstvo"],[]],
  ["Luxembursko","Luxemburg","Západná Európa",["Luxembourg"],["Luxembourg","Luxembursko"]],
  ["Monako","Monako","Západná Európa",["Monaco"],["Monaco"]],

  ["Island","Reykjavík","Severná Európa",[],["Reykjavik"]],
  ["Nórsko","Oslo","Severná Európa",[],[]],
  ["Švédsko","Štokholm","Severná Európa",[],["Stockholm"]],
  ["Fínsko","Helsinki","Severná Európa",[],["Helsinky"]],
  ["Dánsko","Kodaň","Severná Európa",[],["Kodan","Kobenhavn","Copenhagen"]],
  ["Estónsko","Tallinn","Severná Európa",[],["Talin"]],
  ["Lotyšsko","Riga","Severná Európa",[],[]],
  ["Litva","Vilnius","Severná Európa",[],["Vilno"]],

  ["Nemecko","Berlín","Stredná Európa",[],["Berlin"]],
  ["Poľsko","Varšava","Stredná Európa",[],["Warszawa"]],
  ["Česko","Praha","Stredná Európa",["Česká republika","Cesko"],[]],
  ["Slovensko","Bratislava","Stredná Európa",["Slovenská republika"],[]],
  ["Maďarsko","Budapešť","Stredná Európa",[],["Budapest"]],
  ["Rakúsko","Viedeň","Stredná Európa",[],["Wien","Vieden"]],
  ["Švajčiarsko","Bern","Stredná Európa",[],[]],
  ["Lichtenštajnsko","Vaduz","Stredná Európa",["Liechtenstein","Lichtenstajnsko"],[]],
  ["Slovinsko","Ľubľana","Stredná Európa",[],["Ljubljana","Lublana"]],

  ["Portugalsko","Lisabon","Južná Európa",[],["Lisboa"]],
  ["Španielsko","Madrid","Južná Európa",[],[]],
  ["Andorra","Andorra la Vella","Južná Európa",[],["Andorra"]],
  ["Taliansko","Rím","Južná Európa",[],["Roma","Rim"]],
  ["Vatikán","Vatikán","Južná Európa",["Vatikan","Svätá stolica"],["Vatikan"]],
  ["San Maríno","San Maríno","Južná Európa",["San Marino"],["San Marino"]],
  ["Malta","Valletta","Južná Európa",[],["Valeta","La Valletta"]],
  ["Grécko","Atény","Južná Európa",[],["Atheny","Athens","Athina"]],
  ["Cyprus","Nikózia","Južná Európa",[],["Nikosia","Lefkosia"]],

  ["Chorvátsko","Záhreb","Balkán",[],["Zagreb"]],
  ["Bosna a Hercegovina","Sarajevo","Balkán",["Bosna","BiH","Bosna Hercegovina"],[]],
  ["Srbsko","Belehrad","Balkán",[],["Beograd","Belgrad"]],
  ["Čierna Hora","Podgorica","Balkán",["Montenegro"],[]],
  ["Kosovo","Priština","Balkán",[],["Pristina"]],
  ["Albánsko","Tirana","Balkán",[],["Tirane"]],
  ["Severné Macedónsko","Skopje","Balkán",["Macedónsko"],[]],
  ["Bulharsko","Sofia","Balkán",[],["Sofija"]],
  ["Rumunsko","Bukurešť","Balkán",[],["Bucuresti","Bukurest"]],

  ["Moldavsko","Kišiňov","Východná Európa",["Moldavská republika","Moldova"],["Chisinau","Kisinov","Kišinev"]],
  ["Ukrajina","Kyjev","Východná Európa",[],["Kijev","Kiev","Kyiv"]],
  ["Bielorusko","Minsk","Východná Európa",["Belorusko","Bělorusko"],[]],
  ["Rusko","Moskva","Východná Európa",["Ruská federácia"],["Moscow"]],
];

const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "");
function lev(a, b) {
  if (Math.abs(a.length - b.length) > 1) return 2;
  const prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    let diag = prev[0]; prev[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const tmp = prev[j];
      prev[j] = Math.min(prev[j] + 1, prev[j - 1] + 1, diag + (a[i - 1] === b[j - 1] ? 0 : 1));
      diag = tmp;
    }
  }
  return prev[b.length];
}
const exact = (input, names) => { const x = norm(input); return !!x && names.some(n => norm(n) === x); };
// presná zhoda, alebo jeden preklep pri dlhších slovách
const matches = (input, names) => {
  const x = norm(input);
  return !!x && names.some(n => { const y = norm(n); return x === y || (y.length >= 6 && lev(x, y) <= 1); });
};

const ITEMS = DATA.map(([country, capital, region, ca, pa], i) => ({
  i, country, capital, region, countryNames: [country, ...ca], capitalNames: [capital, ...pa]
}));
const TOTAL = ITEMS.length;
const REGIONS = [...new Set(ITEMS.map(x => x.region))];

const MODES = {
  mesta: {
    sub: "Pri každom hlavnom meste je prázdne pole. Dopíš, ktorého štátu je hlavným mestom.",
    givenCol: "Hlavné mesto", ansCol: "Štát",
    given: it => it.capital, answer: it => it.country, names: it => it.countryNames,
    wrong: (it, v) => `${v} nie je štát, ktorého hlavné mesto je ${it.capital}.`,
  },
  staty: {
    sub: "Pri každom štáte je prázdne pole. Dopíš jeho hlavné mesto.",
    givenCol: "Štát", ansCol: "Hlavné mesto",
    given: it => it.country, answer: it => it.capital, names: it => it.capitalNames,
    wrong: (it, v) => `${v} nie je hlavné mesto štátu ${it.country}.`,
  },
};

const newState = () => ({ status: {}, found: 0, errors: 0, elapsed: 0, startedAt: null, over: false, message: null });
const state = { mesta: newState(), staty: newState() };
let mode = "mesta", tick = null;

const $ = id => document.getElementById(id);
const fmt = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const S = () => state[mode];
const elapsed = st => st.elapsed + (st.startedAt ? Date.now() - st.startedAt : 0);

function startTimer() {
  const st = S();
  if (st.startedAt || st.over) return;
  st.startedAt = Date.now();
}
function pauseTimer(st) { if (st.startedAt) { st.elapsed += Date.now() - st.startedAt; st.startedAt = null; } }

function say(text, kind) { S().message = [text, kind]; $("msg").textContent = text; $("msg").className = "msg " + kind; }

function render() {
  const m = MODES[mode], st = S();
  document.querySelectorAll(".modes button").forEach(b => b.setAttribute("aria-selected", b.dataset.mode === mode));
  $("sub").textContent = m.sub;
  const root = $("regions");
  root.innerHTML = "";
  for (const r of REGIONS) {
    const list = ITEMS.filter(x => x.region === r).sort((a, b) => m.given(a).localeCompare(m.given(b), "sk"));
    const sec = document.createElement("section");
    sec.className = "region";
    sec.innerHTML = `<h2>${r}<small data-region="${r}"></small></h2><div class="cols"><span>${m.givenCol}</span><span>${m.ansCol}</span></div><ol></ol>`;
    const ol = sec.querySelector("ol");
    for (const it of list) {
      const li = document.createElement("li");
      li.dataset.i = it.i;
      const given = document.createElement("span");
      given.className = "given"; given.textContent = m.given(it);
      li.appendChild(given);
      const s = st.status[it.i];
      if (s) {
        li.className = s;
        const a = document.createElement("span");
        a.className = "ans"; a.textContent = m.answer(it);
        li.appendChild(a);
      } else {
        const inp = document.createElement("input");
        inp.id = `in-${mode}-${it.i}`;
        inp.autocomplete = "off"; inp.spellcheck = false;
        inp.setAttribute("autocapitalize", "words");
        inp.setAttribute("enterkeyhint", "next");
        inp.setAttribute("aria-label", `${m.ansCol} pre ${m.given(it)}`);
        inp.disabled = st.over;
        inp.addEventListener("input", () => { startTimer(); li.classList.remove("wrong"); if (exact(inp.value, m.names(it))) accept(it, li); });
        inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); check(it, li, inp); } });
        li.appendChild(inp);
      }
      ol.appendChild(li);
    }
    root.appendChild(sec);
  }
  if (st.message) say(...st.message);
  else say("Píš do prázdnych polí. Správna odpoveď sa uzná sama, Enter ju skontroluje a posunie ťa ďalej.", "info");
  const done = $("done");
  done.hidden = !st.over;
  if (st.over) done.textContent = st.found === TOTAL
    ? `Hotovo! Všetkých ${TOTAL} za ${fmt(elapsed(st))}, počet chýb: ${st.errors}.`
    : `Uhádol si ${st.found} z ${TOTAL}. Červené sú tie, ktoré ti chýbali.`;
  refresh();
}

function refresh() {
  const st = S();
  $("score").textContent = `${st.found}/${TOTAL}`;
  $("errors").textContent = st.errors;
  $("time").textContent = fmt(elapsed(st));
  $("bar").style.width = (st.found / TOTAL * 100) + "%";
  for (const k of Object.keys(MODES)) $("tc-" + k).textContent = `${state[k].found}/${TOTAL}`;
  document.querySelectorAll("[data-region]").forEach(el => {
    const list = ITEMS.filter(x => x.region === el.dataset.region);
    el.textContent = `${list.filter(x => st.status[x.i] === "found").length}/${list.length}`;
  });
}

function focusNext(fromLi) {
  const inputs = [...document.querySelectorAll(".region li input")];
  if (!inputs.length) return;
  const all = [...document.querySelectorAll(".region li")];
  const idx = all.indexOf(fromLi);
  const next = inputs.find(inp => all.indexOf(inp.closest("li")) > idx) || inputs[0];
  next.focus();
}

function accept(it, li) {
  const st = S(), m = MODES[mode];
  if (st.status[it.i]) return;
  st.status[it.i] = "found"; st.found++;
  li.querySelector("input").remove();
  li.className = "found flash";
  const a = document.createElement("span");
  a.className = "ans"; a.textContent = m.answer(it);
  li.appendChild(a);
  setTimeout(() => li.classList.remove("flash"), 900);
  say(`Správne: ${m.given(it)} – ${m.answer(it)}. Zostáva ${TOTAL - st.found}.`, "ok");
  refresh();
  if (st.found === TOTAL) finish(true); else focusNext(li);
}

function check(it, li, inp) {
  const v = inp.value.trim();
  if (!v) { focusNext(li); return; }
  startTimer();
  if (matches(v, MODES[mode].names(it))) { accept(it, li); return; }
  S().errors++;
  li.classList.remove("wrong"); void li.offsetWidth; li.classList.add("wrong");
  say(MODES[mode].wrong(it, v), "bad");
  inp.select();
  refresh();
}

function finish(won) {
  const st = S();
  pauseTimer(st);
  st.over = true;
  if (!won) ITEMS.forEach(x => { if (!st.status[x.i]) st.status[x.i] = "missed"; });
  st.message = won ? ["Výborne!", "ok"] : ["Hra skončila. Klikni na Hrať znova.", "info"];
  render();
}

function setMode(m) {
  if (!MODES[m] || m === mode) return;
  pauseTimer(S());
  mode = m;
  try { history.replaceState(null, "", "#" + m); } catch (e) {}
  render();
}

document.querySelectorAll(".modes button").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
window.addEventListener("hashchange", () => setMode(location.hash.slice(1)));
$("giveup").addEventListener("click", () => { if (!S().over) finish(false); });
$("restart").addEventListener("click", () => {
  state[mode] = newState();
  render();
  say("Nová hra. Začni písať.", "info");
  const first = document.querySelector(".region li input");
  if (first) first.focus();
});
tick = setInterval(() => { if (S().startedAt) $("time").textContent = fmt(elapsed(S())); }, 250);

if (MODES[location.hash.slice(1)]) mode = location.hash.slice(1);
render();
</script>
<!-- ARTIFACT-END -->
</body>
</html>
